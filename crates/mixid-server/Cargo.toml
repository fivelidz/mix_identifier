[package]
name = "mixid-server"
version = "0.1.0"
edition = "2021"

[dependencies]
mixid-core = { path = "../mixid-core" }
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "net"] }
tower-http = { version = "0.6", features = ["fs"] }
